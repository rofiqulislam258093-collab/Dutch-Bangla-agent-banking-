<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Premium Profile</title>
    
    <!-- Modern Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ================= VARIABLES ================= */
        :root {
            --primary: #ff0000;
            --accent: #ff4d4d;
            --dark: #050000;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --glow: 0 0 20px rgba(255, 0, 0, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            background-color: var(--dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
            perspective: 1500px;
        }

        /* ================= DYNAMIC BACKGROUND ================= */
        .background-animation {
            position: absolute;
            width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a0000 0%, #000000 100%);
        }

        .particle {
            position: absolute;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.3;
            animation: floatParticle 10s infinite linear;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ================= 3D CARD ================= */
        .card {
            width: 100%;
            max-width: 400px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 50px 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            transform-style: preserve-3d;
            transition: transform 0.1s;
            position: relative;
            z-index: 10;
        }

        /* ================= ROTATING PROFILE RING (ADVANCED) ================= */
        .profile-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translateZ(50px);
        }

        /* The Spinning Ring */
        .spin-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--primary);
            border-right-color: var(--accent);
            animation: spin 3s linear infinite;
            box-shadow: 0 0 15px var(--primary);
        }

        .spin-ring::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-bottom-color: #fff;
            animation: spin 5s linear infinite reverse;
            opacity: 0.5;
        }

        /* Glow Behind Image */
        .glow-bg {
            position: absolute;
            width: 120px; height: 120px;
            background: var(--primary);
            filter: blur(40px);
            opacity: 0.4;
            animation: pulse 2s infinite;
        }

        .profile-img {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #1a0000;
            position: relative;
            z-index: 2;
        }

        /* Status Dot */
        .status {
            position: absolute;
            bottom: 10px; right: 10px;
            width: 20px; height: 20px;
            background: #00ff00;
            border: 3px solid #000;
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 0 10px #00ff00;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.3; } 50% { transform: scale(1.1); opacity: 0.5; } 100% { transform: scale(0.9); opacity: 0.3; } }

        /* ================= TEXT & TYPING ================= */
        .info {
            text-align: center;
            transform: translateZ(30px);
            margin-bottom: 30px;
        }

        .name {
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(to bottom, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .typing-text {
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: 500;
            letter-spacing: 2px;
            min-height: 20px;
        }
        
        /* Cursor Effect */
        .cursor {
            display: inline-block;
            width: 2px;
            background-color: white;
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ================= BUTTONS ================= */
        .social-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            transform: translateZ(20px);
        }

        .btn {
            position: relative;
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            text-decoration: none;
            color: white;
            overflow: hidden;
            transition: 0.4s;
        }

        .btn i {
            font-size: 1.4rem;
            width: 40px;
            z-index: 2;
            transition: 0.4s;
        }

        .btn span {
            z-index: 2;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Slide Hover Effect */
        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, var(--primary), #800000);
            transform: translateX(-100%);
            transition: 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
        }

        .btn:hover {
            transform: translateX(5px);
            border-color: var(--primary);
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.2);
        }
        .btn:hover::before { transform: translateX(0); }
        .btn:hover i { transform: scale(1.2) rotate(10deg); }

        /* ================= FOOTER ================= */
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            transform: translateZ(10px);
        }

        /* ================= MOBILE OPTIMIZATION ================= */
        @media (max-width: 600px) {
            .card {
                width: 90%;
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Dynamic Background Particles -->
    <div class="background-animation" id="bgAnimation"></div>

    <!-- 3D Card -->
    <div class="card" id="tiltCard">
        
        <!-- Rotating Profile Section -->
        <div class="profile-wrapper">
            <div class="glow-bg"></div> <!-- Red Glow -->
            <div class="spin-ring"></div> <!-- Rotating Lines -->
            <img src="https://i.postimg.cc/6Qb8MQL6/Picsart-26-08-09-19-51-24-650.jpg" alt="Profile" class="profile-img">
            <div class="status"></div> <!-- Online Dot -->
        </div>

        <!-- Name & Typing Animation -->
        <div class="info">
            <h1 class="name">MD : JIAUL HAQUE </h1>
            <p><span class="typing-text"></span><span class="cursor">|</span></p>
        </div>

        <!-- Links -->
        <div class="social-list">
            <a href="https://m.me/Ziaulboss" class="btn">
                <i class="fa-brands fa-facebook-messenger"></i>
                <span>Messenger</span>
            </a>
            <a href="https://wa.me/8801714136261" class="btn">
                <i class="fa-brands fa-whatsapp"></i>
                <span>WhatsApp</span>
            </a>
            <a href="https://wa.me/+8801714136261" class="btn">
                <i class="fa-brands fa-telegram"></i>
                <span>Telegram</span>
           <a href="tel:+8801714136261" class="btn">
                <i class="fa-solid fa-phone"></i>
             <span>Call Now</span>
                </a>
            </a>
            <a href="amaderbms@gmail.com" class="btn">
                <i class="fa-solid fa-envelope"></i>
                <span>Send Email</span>
            </a>
        </div>

        <div class="footer">
            &copy; 2024 | DESIGNED WITH 🔥
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // 1. Generate Background Particles
        const bg = document.getElementById('bgAnimation');
        for(let i=0; i<30; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (Math.random() * 5 + 5) + 's';
            p.style.width = Math.random() * 10 + 'px';
            p.style.height = p.style.width;
            bg.appendChild(p);
        }

        // 2. Typing Effect
        const words = ["ডাচ্-বাংলা ব্যাংকের সকল সেবা ও সমস্যার সমাধানে যোগাযোগ করুন।", "UI/UX Designer", "Content Creator", "Freelancer"];
        let i = 0;
        let timer;

        function typeWriter() {
            const span = document.querySelector('.typing-text');
            const word = words[i];
            let letterIndex = 0;

            function type() {
                if (letterIndex < word.length) {
                    span.textContent += word.charAt(letterIndex);
                    letterIndex++;
                    setTimeout(type, 100);
                } else {
                    setTimeout(erase, 2000);
                }
            }

            function erase() {
                if (letterIndex > 0) {
                    span.textContent = word.substring(0, letterIndex - 1);
                    letterIndex--;
                    setTimeout(erase, 50);
                } else {
                    i = (i + 1) % words.length;
                    setTimeout(type, 500);
                }
            }
            type();
        }
        typeWriter();

        // 3. 3D Tilt Effect
        const card = document.getElementById('tiltCard');
        document.addEventListener('mousemove', (e) => {
            if(window.innerWidth > 768) {
                let xAxis = (window.innerWidth / 2 - e.pageX) / 25;
                let yAxis = (window.innerHeight / 2 - e.pageY) / 25;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateY(0deg) rotateX(0deg)';
        });
    </script>
</body>
</html>
